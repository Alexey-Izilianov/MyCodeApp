name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.11.2' # маска 6.11.* берёт новейший выпуск, которого может ещё не быть в зеркале

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MinGW)
            os: windows-latest
            qt_arch: win64_mingw
            qt_tools: tools_mingw1310,qt.tools.win64_mingw1310
            # Qt 6.11 разложил Windows-сборки по папкам компиляторов (qt6_6112_mingw);
            # это понимает только ветка master aqtinstall — релиз 3.3.0 старше
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          - name: Linux (GCC)
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: macOS (Clang)
            os: macos-14
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          aqtsource: ${{ matrix.aqtsource }}
          cache: true

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: MinGW in PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$IQTA_TOOLS/mingw1310_64/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        shell: bash
        working-directory: build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --output-on-failure
          elif ! ctest --output-on-failure; then
            # стек упавших тестов для разбора (на macOS они падают без вывода)
            for t in $(ctest --rerun-failed -N | sed -n 's/.*Test *#[0-9]*: *//p'); do
              lldb --batch -o run -k bt -k quit -- ./test_$t || true
            done
            exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package.ps1 -BuildDir build -OutDir dist

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MyCodeApp-windows
          path: dist/*.zip

      - name: Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    # Qt собран без TSan: синхронизацию в QThreadPool/QMutex он не видит и сообщает о
    # гонках при каждой передаче работы в пул. Отчёт полезен, но сборку не валит
    continue-on-error: ${{ matrix.sanitizer == 'thread' }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address+undefined, thread]
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 xvfb
      - name: Configure
        run: |
          # -DSHA1DC_FORCE_ALIGNED_ACCESS: SHA-1 в libgit2 на x86 читает невыровненные слова, UBSan это ловит
          FLAGS="-fsanitize=${{ matrix.sanitizer == 'thread' && 'thread' || 'address,undefined' }} -fno-omit-frame-pointer"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_C_FLAGS="$FLAGS -DSHA1DC_FORCE_ALIGNED_ACCESS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
      - run: cmake --build build --parallel
      - name: Tests
        working-directory: build
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          MYCODEAPP_NO_PERF: 1 # под санитайзерами код в разы медленнее — замеры скорости не проверяем
          ASAN_OPTIONS: detect_leaks=0 # утечки в драйверах GL/Qt не наши
        run: xvfb-run -a ctest --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev clang-tidy clang
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
      - run: cmake --build build --parallel # moc и qmltyperegistrations нужны для разбора
      - run: run-clang-tidy -p build -quiet "$PWD/src/.*\.cpp$"
